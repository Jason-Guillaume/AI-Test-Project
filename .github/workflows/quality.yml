name: Develop Quality Gate

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: develop-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Node tests
        working-directory: frontend
        run: npm test
      - name: Vite build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testplatform
          POSTGRES_PASSWORD: testplatform-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testplatform -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_USER: testplatform
      TEST_POSTGRES_PASSWORD: testplatform-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt
      - name: PostgreSQL migration compatibility
        working-directory: backend
        run: .venv/bin/python -m pytest -q tests/test_57_organization_recycle_bin_migration.py
      - name: Full backend tests
        working-directory: backend
        run: .venv/bin/python -m pytest -q

  playwright:
    name: Browser E2E and responsive routes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testplatform
          POSTGRES_PASSWORD: testplatform-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testplatform -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt
      - name: Install frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Configure disposable PostgreSQL URL
        run: printf '%s\n' 'DATABASE_URL=postgresql+psycopg://testplatform:testplatform-ci-only@127.0.0.1:5432/postgres' > backend/.env
      - name: Run full isolated E2E suite
        run: bash scripts/e2e_case_generation.sh
      - name: Upload browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            frontend/e2e/artifacts/
            frontend/e2e/report/
            docs/second-round-quality-fix/screenshots/
