server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Supervisor generation performs several sequential model calls.
    # Match the existing generation client timeout without changing other API routes.
    location ~ ^/api/v1/(agent-governance/agents/[0-9]+|projects/[0-9]+/agents/[0-9]+)/generate-cases$ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(healthz|health|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
